<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
    <link rel="stylesheet" href="../Css/Telas.css">
</head>
<body>
    <header>
        <h1>DashBoard</h1>
    </header>
    <main>
        <a href="Add_Produto.html" id="btnAdicionar">+ Adiconar produto</a>
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Valor total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaProdutos">

            </tbody>
        </table>
    </main>


    <div id="msgEditar">
        <Form id="formEditar">
            <label for="produto">Produto</label><br>
            <input type="text" name="produto" id="produto"><br>

            <label for="descrição">Descrição</label><br>
            <input type="text" name="descricao" id="descricao"><br>

            <label for="preco">Preço</label><br>
            <input type="text" name="preco" id="preco"><br>

            <label for="produto"> Quantidade</label><br>
            <input type="text" name="quantidade" id="quantidade"><br>

            <button id="mudar" type="submit">Enviar</button>
        </Form>
        <button id="cancelar">X</button>
    </div>
    <script src="../JavaScript/Tela_Principal.js"></script>
</body>
</html>
